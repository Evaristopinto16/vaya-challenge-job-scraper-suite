services:
  db:
    image: postgres:16
    container_name: job-indexer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_indexer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - job_indexer_data:/var/lib/postgresql/data
  api:
    build: .
    container_name: job-indexer-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  job_indexer_data:
